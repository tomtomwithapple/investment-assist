  # ---------------- phase G: local UI view (PLAN S23-S28, planned 2026-10-27) ----------------
  # Serial chain: every view registers in web.py's route table. Stdlib only (http.server,
  # html.escape), no JS, no new deps. Read-only: no writes to out/ or journal/, no fetch, no send.
  # Every slice that edits web.py also runs tests/test_status.py in accept. Every view test
  # includes a value with <script> (driver, symbol, reason, fingerprint) and asserts it escaped.
  - id: P40-ui-shell
    title: "PLAN S23: UI shell: App paths, shared layout and nav, route table, /status, 404s, .json twins, escaping"
    depends_on: [F6-us-stocks]
    owns: ["src/assist/web.py", "src/assist/status.py", "src/assist/views/__init__.py",
           "tests/test_web.py", "tests/test_status.py", "docs/results/P40-ui-shell.md"]
    accept: uv run pytest -q tests/test_web.py tests/test_status.py && uv run ruff check src/assist/web.py src/assist/status.py
    estimate: 1.5
    notes: >-
      web.py owns the server loop and the shell; status.py imports web (never the reverse) for
      layout and chips, and status.serve(build, port, ready, *, app=None) stays as a thin wrapper
      over web.serve so cli._status keeps working unchanged until F7. App is a dataclass of
      out_dir, snapshots_dir, journal_path, paper (callable(until: date) -> report) and
      health (the existing build callable); its defaults come from pipeline.Paths.default()
      (out, snapshots, journal) and paper.paper_track, so later slices' live runs use the real
      paths without touching cli.py. layout(title, body, active) -> full page with a nav
      (Overview /, Candidates /candidates, Paper /paper, Journal /journal, Status /status), the
      disclaimer "Heuristic, not investment advice." in the footer, status.PAGE's CSS tokens and
      dark mode moved here; the status page's <title> stays "Assist Status". Route table: list
      of (compiled regex, handler(app, match) -> View(title, html, data) | None). A trailing
      ".json" is stripped before matching and returns View.data as JSON; None or no match -> 404
      page in the layout; a handler exception -> 500 page with the error escaped. GET and HEAD
      only (HEAD: headers, no body). /status and /status.json serve the health page; /json stays
      an alias of /status.json. Until S24, / is a 302 to /status. Update test_status.py's serve
      test to check /status, /status.json and /json and assert nothing about /. Tests in
      test_web.py: matching, .json twin, 404, 500, HEAD, <script> escaped, nav and disclaimer on
      every page, host 127.0.0.1. Live: `uv run assist status --port 8799`, curl /status, /json,
      /nope.

  - id: P41-ui-overview
    title: "PLAN S24: UI overview: regime and dollar banner, country x asset stance grid, commodities, stale markers"
    depends_on: [P40-ui-shell]
    owns: ["tests/test_web.py", "src/assist/views/overview.py", "src/assist/web.py", "tests/test_view_overview.py",
           "tests/fixtures/ui/out/**", "docs/results/P41-ui-overview.md"]
    accept: uv run pytest -q tests/test_view_overview.py tests/test_web.py tests/test_status.py && uv run ruff check src/assist/views/overview.py src/assist/web.py
    estimate: 1
    notes: >-
      / replaces the S23 redirect. Stances from brief.load_out(app.out_dir), which returns
      Loaded(stances, problems) and reads only out/{SUBJECT}/*.json: build tests/fixtures/ui/out/
      in that layout (e.g. copy tests/fixtures/stance/IDN-bonds.json to ui/out/IDN/bonds.json;
      the stance fixtures dir is flat and load_out finds nothing there). Show problems as a
      notice. Banner: as_of, then regime and dollar as the brief prints them
      (brief._grouped_line(name, brief._by_value(stances, field)): one value, or mixed grouped by
      value), and the count per stance. Grid: rows = countries (asset != "commodities"; subject_type
      is optional, do not rely on it) ordered by brief._sort_key; columns stocks | bonds |
      currency; cell = stance chip (overweight good, underweight/avoid bad, neutral muted),
      score, confidence, "stale" when stale_inputs is non-empty, linking to
      /stance/<SUBJECT>/<asset>; a missing cell is "-" (USA has no currency stance: test it).
      Commodities in a second table. Empty out/ -> notice "no stances in out/ yet: run `assist
      run`". JSON twin: the rows used. Live: 12 countries, 35 cells plus 14 commodities on the
      real out/.

  - id: P42-ui-stance
    title: "PLAN S25: UI stance detail: drivers, risks, watch, entry, portfolio, flags, sources, change since last snapshot"
    depends_on: [P41-ui-overview]
    owns: ["tests/test_web.py", "src/assist/views/stance.py", "src/assist/web.py", "tests/test_view_stance.py",
           "tests/fixtures/ui/out/**", "tests/fixtures/ui/snapshots/**", "docs/results/P42-ui-stance.md"]
    accept: uv run pytest -q tests/test_view_stance.py tests/test_web.py tests/test_status.py && uv run ruff check src/assist/views/stance.py src/assist/web.py
    estimate: 1
    notes: >-
      /stance/<SUBJECT>/<asset>: match the pair exactly against the loaded stances, never build a
      path from the URL. 404 for an unknown pair, /stance/IDN/../x and /stance/idn/bonds (case
      sensitive); /stance/IDN/bonds.json is the JSON twin (the stance dict as written). Show
      stance, score, layer1_score, confidence, regime, dollar, drivers, risks, watch, entry
      (style, tranches, spacing_days), portfolio (current_pct, target_pct, delta), flags (objects
      {code, message, severity}: severity as a chip), stale_inputs, sources, model_fingerprint
      (short) and the disclaimer. Change since the last snapshot: prev =
      brief.previous_snapshot(app.snapshots_dir, before=as_of) returns a directory or None; if a
      directory, brief.load_out(prev) and match (subject, asset) for the old stance and score,
      else "no earlier snapshot". Live: /stance/IDN/bonds and /stance/USA/bonds (has
      high_gov_debt flag) on the real out/.

  - id: P43-ui-candidates
    title: "PLAN S26: UI candidates: per-market hurdle, tilt, style verdicts, ranked rows, sizes, trims, excluded"
    depends_on: [P42-ui-stance]
    owns: ["tests/test_web.py", "src/assist/views/candidates.py", "src/assist/web.py", "tests/test_view_candidates.py",
           "tests/fixtures/ui/candidates/**", "docs/results/P43-ui-candidates.md"]
    accept: uv run pytest -q tests/test_view_candidates.py tests/test_web.py tests/test_status.py && uv run ruff check src/assist/views/candidates.py src/assist/web.py
    estimate: 1.5
    notes: >-
      /candidates (every app.out_dir/candidates/*.json, IDN first, then by name) and
      /candidates/<MKT> (matched against the files found, else 404). Glob and json.load each file
      here (undervalued.load_out skips invalid files silently): an invalid file shows a notice.
      Field names from schema/candidates.schema.json and brief.undervalued_lines; copy trimmed
      real IDN.json and USA.json into tests/fixtures/ui/candidates/, plus one with a non-null
      size. Per market: as_of, bar_date, currency, regime, stance, hurdle required_pt and
      drivers; tilt {passed, verdict, sectors}; each style with verdict, t, p, pool and its rows
      (rank, symbol, sector, action, margin_pt, margin_shift_pt, net_margin_pt, expected,
      cost.round_trip_bps, entry, held and held_idr, size.idr, tranche count from size.tranches
      with a per-tranche day/idr/shares/limit list), its dropped names; a failed style shows its
      verdict and no rows; sizing budget_idr, trims and excluded [{symbol, reason}];
      stale_inputs. size is null on every IDN row today (budget 0): show "-". Any absent
      optional field renders "-", never a KeyError. Live: both real files render; note row
      counts.

  - id: P44-ui-paper
    title: "PLAN S27: UI paper track vs IDR 60/40 per model segment, and journal chain check per model"
    depends_on: [P43-ui-candidates]
    owns: ["tests/test_web.py", "src/assist/views/paper.py", "src/assist/web.py", "tests/test_view_paper.py",
           "docs/results/P44-ui-paper.md"]
    accept: uv run pytest -q tests/test_view_paper.py tests/test_web.py tests/test_status.py && uv run ruff check src/assist/views/paper.py src/assist/web.py
    estimate: 1
    notes: >-
      /paper: report = app.paper(until=today) (tests inject a canned report). Benchmark summary
      keys weeks, stale_weeks, cumulative, annualized, volatility; worst week = min of
      m.benchmark over report.benchmark marks (computed here, say so on the page); stale
      reasons = report.stale_inputs plus distinct mark.stale. Segments: fingerprint (short),
      span first_as_of..last_as_of (until), decisions, weeks, stale_weeks, portfolio_return,
      benchmark_return, active_return, hit_rate; follow brief.paper_lines' wording. paper reads
      sibling stores (dbnomics' lock is mutual): any exception, SourceUnavailable or lock error
      -> a notice with the error, the page still renders; cache the report per (day, journal
      mtime) so reloads do not reopen the stores. /journal: copy cli._journal: verify() returns
      the count or raises ValueError (chain BROKEN: reason), then segments() per model
      (records, stance count, span of as_of). Never writes the journal. Live: both pages on the
      real journal.

  - id: F7-ui
    kind: integration
    title: "PLAN S28 fan-in: UI wired into assist status, README and CLI help, live check of every page"
    depends_on: [P44-ui-paper]
    owns: ["tests/test_web.py", "src/assist/cli.py", "src/assist/web.py", "src/assist/status.py", "README.md",
           "tests/test_ui_e2e.py", "PLAN.md"]
