      Read ../idx-method/store/data/stockbiter.db READ-ONLY (SQLite, use doctor.open_sqlite or the
      base.py helper). factor_series(item, date, ...) holds daily price and mktcap from 2016-10 and
      quarterly cfo_ttm, equity, net_debt, ni_ttm, op_income_ttm, roa, roce, total_assets,
      total_debt from 2016-12 (checked 2026-10-27; inspect the real schema for the symbol and
      value column names). Give: per-symbol daily (date, price, mktcap); per-symbol quarterly
      fundamentals with an `available` date = period end + screens.LAG_DAYS (120) until
      idx-method V3 says otherwise, and a `known_at(sym, d)` that returns only rows available by d;
      derived point-in-time multiples PE = mktcap/ni_ttm, PBV = mktcap/equity, P/CFO,
      EV/EBIT = (mktcap+net_debt)/op_income_ttm (None when the denominator <= 0); quarter-end
      dates. Also dividends from the stockbiter.db `dividends` table (symbol, seq, ex, value, ccy)
      if present, else IdxMethodStocks.dividends(). Delisted symbols kept. Missing db or table ->
      SourceUnavailable. Live: count symbols, date span per item, multiples for 3 names
