  - id: P34-hurdle
    title: "PLAN S17: IDR hurdle per market (local 10Y + ERP + CRP, unhedged FX haircut, risk-off premium)"
    depends_on: [S1-contracts, P16-dbnomics, P32-phei, P27-fx-idr, P29-candidates-foreign, P8-regime]
    owns: ["src/assist/candidates/hurdle.py", "tests/test_hurdle.py", "docs/results/P34-hurdle.md"]
    accept: uv run pytest -q tests/test_hurdle.py && uv run ruff check src/assist/candidates/hurdle.py
    estimate: 1.5
    notes: >-
      One function serves index and single names: hurdle(market, as_of, regime, ...) -> Hurdle
      (required annual IDR return, components, drivers, stale). IDN: SBN 10Y from PHEI igsyc_point
      (P32), else dbnomics idn.rate.long flagged proxy, plus US implied ERP + IDN CRP (same series
      and fallback as layers/rules/idn_stocks._hurdle; do not edit that file, reuse its constants
      by import). Foreign (USA first, also JPN/EMU/AUS/SGP where data exist): local 10Y + US ERP +
      that country's CRP, and the unhedged IDR view: expected_fx_move from
      layers/candidates_foreign (adverse 5% quantile, else UIP) applied with fx.unhedged_idr_return;
      no hedge cost (user decision 2026-10-27). Risk-off regime adds +1.0 pt; constants in a
      module-level dict that is part of the model fingerprint. Also margin(expected_idr, hurdle,
      sector_shift_pt=0) -> pt. Live: today's IDN and USA hurdles with components.

  - id: P35-sector-tilt
    title: "PLAN S16: IDN macro sector tilt (hand-set sensitivity table, drivers from layers 0-2, quarterly placebo replay)"
    depends_on: [P33-factor-series, P8-regime, P1-worldbankscape, P12-bisfetcher, P16-dbnomics, P11-bps, P13-idx-flows]
    owns: ["src/assist/candidates/tilt.py", "config/sector_tilt.yaml", "tests/test_tilt.py",
           "tests/fixtures/tilt/**", "docs/results/P35-sector-tilt.md"]
    accept: uv run pytest -q tests/test_tilt.py && uv run ruff check src/assist/candidates/tilt.py
    estimate: 2.5
    notes: >-
      config/sector_tilt.yaml: per IDX-IC sector (names as in idx-method data/sectors.json), signed
      sensitivities to drivers: commodity trend (worldbankscape commodity scores / Pink Sheet:
      coal, nickel, palm oil), China momentum (dbnomics cn.*), BI rate direction and IDN real yield
      (bisfetcher WS_CBPOL.M.ID, CPI), credit gap (WS_CREDIT_GAP), USD/IDR trend (JISDOR, WS_EER
      REER), consumer (CPI, dbnomics CCI IDN), regime (risk_on/neutral/risk_off from layers/regime).
      Each driver is a direction in -1..+1 with its reading as a driver string; tilt = clipped
      weighted sum in -1..+1 per sector. Outputs SectorTilt(sector, tilt, drivers, stale) and two
      mappings PLAN fixes: required-margin shift = -2 pt x tilt (tailwind needs less discount) and
      sector cap = round(5 + 2 x tilt) names (3..7). Point in time: every driver read as of d.
      Replay: quarter ends over the factor_series history (P33), sector return = mktcap-weighted
      3-month forward return of the sector's names; observations = top-tilt minus bottom-tilt
      sector returns; assist.eval.placebo.evaluate with shuffled tilts as control. Verdict and
      fingerprint (hash of the yaml) returned; a failed verdict means S20 applies no shift and the
      default cap 5. Live: today's tilts and the verdict into docs/results.

  - id: P36-dividend-value
    title: "PLAN S18: undervalued dividend screen (Gordon return vs hurdle, safety gates, own-yield history, quarterly placebo)"
    depends_on: [P33-factor-series, P34-hurdle, P20-screens]
    owns: ["src/assist/candidates/dividend_value.py", "tests/test_dividend_value.py",
           "tests/fixtures/dividend_value/**", "docs/results/P36-dividend-value.md"]
    accept: uv run pytest -q tests/test_dividend_value.py && uv run ruff check src/assist/candidates/dividend_value.py
    estimate: 2.5
    notes: >-
      Expected return = forward yield (trailing 12m dividends by ex-date / price, screens.
      trailing_dividend) + sustainable growth g = ROE x (1 - payout), capped at IDN nominal GDP
      growth (default 8%, constant in the fingerprint). Safety gates: payout < 90% of ni_ttm,
      dividends covered by cfo_ttm, paid in >= 4 of the last 5 years, no cut in the last 2 years
      unless ni_ttm recovered; existing screens.passes_gates / passes_quality / BANK_FLOOR reused;
      holding companies skipped if the sector map marks them. Cheapness leg: yield percentile vs
      the name's own 5-year yield range. Output per name: expected IDR return, margin over the
      P34 IDN hurdle, legs, gate reasons. Replay at quarter ends with point-in-time data from P33,
      3-month forward return, top vs bottom quintile by margin, placebo via evaluate as
      screens.evaluate_screen does. Failed verdict -> ranking reported, no candidate. Live: verdict,
      pool size, top 10 into docs/results.

  - id: P37-garp
    title: "PLAN S19: undervalued growth (GARP) screen: reverse DCF vs realised and consensus growth, quality, quarterly placebo"
    depends_on: [P33-factor-series, P34-hurdle, P20-screens]
    owns: ["src/assist/candidates/garp.py", "tests/test_garp.py", "tests/fixtures/garp/**",
           "docs/results/P37-garp.md"]
    accept: uv run pytest -q tests/test_garp.py && uv run ruff check src/assist/candidates/garp.py
    estimate: 2.5
    notes: >-
      Reverse DCF: the constant 10-year earnings growth that makes PV of earnings (payout from
      dividends, terminal at the hurdle less nominal GDP growth) equal mktcap, discounted at the
      P34 IDN hurdle; solve by bisection. Compare with realised growth (5-year CAGR of ni_ttm and
      cfo_ttm from P33, both positive at both ends) and consensus EPS growth (IdxMethodStocks.
      consensus(), live only). Candidate leg: gap = min(realised, consensus) - implied, in pt.
      Cross-check PEG on forward PE. Quality gates: ROE or roce stable or rising over 3 years,
      cfo_ttm / ni_ttm >= 0.8, equity dilution < 5%/yr (mktcap/price share-count proxy), plus the
      existing quality floor. Replay at quarter ends with realised growth only (no consensus
      history exists, PLAN S19), 3-month forward return, placebo as P36. Journal the consensus leg
      but never let it rank in a replayed verdict. Live: verdict, pool, top 10.

  - id: P38-sizing
    title: "PLAN S20a: position sizing (stance budget, margin/vol split, per-name, sector and liquidity caps, tranches, trims)"
    depends_on: [P21-cost-entry, P4-portfolio, P10-stance]
    owns: ["src/assist/candidates/sizing.py", "tests/test_sizing.py", "docs/results/P38-sizing.md"]
    accept: uv run pytest -q tests/test_sizing.py && uv run ruff check src/assist/candidates/sizing.py
    estimate: 1.5
    notes: >-
      Pure function: size(candidates, stance, portfolio_value_idr, holdings, regime, caps) ->
      list[Size(symbol, idr, tranches, reason)] plus trims. Budget = (target_pct - current_pct) of
      that country x stocks stance x portfolio value; underweight/avoid -> no adds, only trims of
      held names that fail or have negative margin. Split ∝ margin_pt / vol_1y (margin <= 0 ->
      excluded). Caps: 5% of portfolio per name, sector cap from input (default 5 names), each
      tranche under costs.py's participation limit (cost_for drop flags over_participation,
      below_one_lot), leftover budget redistributed once then left unspent. Tranches from
      entry.entry_plan, laddered when regime is risk_off. Caps are a dict in the fingerprint
      (starting values pending the user's weight bands, PLAN Open questions). Unit tests only; no
      live store needed, but record a worked example in docs/results.

